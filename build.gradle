plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.17'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'univ.inu'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '11'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-web'	// web dependency
	implementation 'org.springframework.boot:spring-boot-starter-security'	// spring security
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'	// mariadb

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'	 // jwt
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'	 // jwt
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5' // jwt

    compileOnly 'org.projectlombok:lombok'			    // lombok
    annotationProcessor 'org.projectlombok:lombok'	    // lombok
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
